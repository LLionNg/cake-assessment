[project]
name = "kol-matcher"
version = "0.1.0"
description = "Match Thai TikTok KOLs to a brand using its Facebook page and website."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=3.4.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.62.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
kol-match = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
